<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>Necklaces - Nimmia Traditional Jewellery</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />

  <style>
    body {
      background-color: #d99f4d;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    /* NAVBAR */
    .navbar {
      background-color: #8b5c29;
    }

    .navbar-brand {
      font-size: 30px;
      font-weight: bold;
      color: white !important;
    }

    .nav-link {
      color: white !important;
    }

    .nav-link:hover {
      color: black !important;
    }

    /* BACK BUTTON */
    .back-btn {
      position: fixed;
      top: 20px;
      left: 20px;
      background-color: #8b5c29;
      color: white;
      border: none;
      padding: 10px 15px;
      border-radius: 50px;
      z-index: 1000;
    }

    /* MAIN CENTER STYLE (LIKE RINGS) */
    .main {
      text-align: center;
      padding: 20px;
    }

    h1 {
      font-weight: bold;
      margin: 20px 0;
    }

    .description {
      max-width: 900px;
      margin: auto;
      padding: 10px 20px 30px;
    }

    /* PRODUCT CARD (SAME AS RINGS STYLE) */
    .gallery {
  transition: transform 0.3s ease, box-shadow 0.3s ease;
}

.gallery:hover {
  transform: translateY(-8px) scale(1.03);
  box-shadow: 0 10px 20px rgba(0,0,0,0.4);
}

.gallery img {
  transition: transform 0.3s ease;
}

.gallery:hover img {
  transform: scale(1.08);
}

.gallery button {
  transition: background-color 0.3s ease, color 0.3s ease;
}

.gallery button:hover {
  background-color: black;
  color: white;
}
    .gallery {
      display: inline-block;
      width: 300px;
      margin: 20px;
      border: 1px solid black;
      box-shadow: 0 5px 9px rgba(0, 0, 0, 0.8);
      background-color: white;
      vertical-align: top;
      border-radius: 10px;
      overflow: hidden;
    }

    .gallery img {
      width: 100%;
      height: 400px;
      object-fit: cover;
    }

    .price {
      background-color: goldenrod;
      padding: 10px;
      font-weight: bold;
      margin: 0;
    }

    .gallery button {
      width: 100%;
      border: none;
      padding: 15px;
      background-color: #8b5c29;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    .gallery button:hover {
      background-color: black;
    }

  </style>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark">
  <div class="container-fluid">
    <a class="navbar-brand" href="#">Nimmia Traditional Jewellery</a>
  </div>
</nav>

<!-- BACK BUTTON -->
<button onclick="history.back()" class="back-btn">
  <i class="fa fa-arrow-left"></i> Back
</button>

<!-- MAIN -->
<div class="main">

  <h1>Necklace Collection</h1>

  <p class="description">
    Explore our heritage-inspired traditional necklaces crafted with elegance and cultural beauty.
  </p>

  <!-- PRODUCTS (CENTER STYLE LIKE RINGS) -->

  <div class="gallery">
    <img src="nek5.jpg" alt="Necklace 1">
    <p class="price">₹2350</p>
    <button onclick="addToCart('Necklace 1',2350,'nek5.jpg')">Add to Cart</button>
  </div>

  <div class="gallery">
    <img src="nek3.jpg" alt="Necklace 2">
    <p class="price">₹3350</p>
    <button onclick="addToCart('Necklace 2',3350,'nek3.jpg')">Add to Cart</button>
  </div>

  <div class="gallery">
    <img src="nek4.jpg" alt="Necklace 3">
    <p class="price">₹2550</p>
    <button onclick="addToCart('Necklace 3',2550,'nek4.jpg')">Add to Cart</button>
  </div>

  <div class="gallery">
    <img src="nek7.jpg" alt="Necklace 4">
    <p class="price">₹2650</p>
    <button onclick="addToCart('Necklace 4',2650,'nek7.jpg')">Add to Cart</button>
  </div>

  <div class="gallery">
    <img src="nek10.jpg" alt="Necklace 5">
    <p class="price">₹3550</p>
    <button onclick="addToCart('Necklace 5',3550,'nek10.jpg')">Add to Cart</button>
  </div>

  <div class="gallery">
    <img src="nek9.jpg" alt="Necklace 6">
    <p class="price">₹3650</p>
    <button onclick="addToCart('Necklace 6',3650,'nek9.jpg')">Add to Cart</button>
  </div>

  <div class="gallery">
    <img src="nekk.jpg" alt="Necklace 7">
    <p class="price">₹2650</p>
    <button onclick="addToCart('Necklace 7',2650,'nekk.jpg')">Add to Cart</button>
  </div>

  <div class="gallery">
    <img src="nek16.jpg" alt="Necklace 8">
    <p class="price">₹2250</p>
    <button onclick="addToCart('Necklace 8',2250,'nek16.jpg')">Add to Cart</button>
  </div>

  <div class="gallery">
    <img src="nekk1.jpg" alt="Necklace 9">
    <p class="price">₹2350</p>
    <button onclick="addToCart('Necklace 9',2350,'nekk1.jpg')">Add to Cart</button>
  </div>

  <div class="gallery">
    <img src="nekk2.jpg" alt="Necklace 10">
    <p class="price">₹1350</p>
    <button onclick="addToCart('Necklace 10',1350,'nekk2.jpg')">Add to Cart</button>
  </div>

  <div class="gallery">
    <img src="nekk3.jpg" alt="Necklace 11">
    <p class="price">₹1450</p>
    <button onclick="addToCart('Necklace 11',1450,'nekk3.jpg')">Add to Cart</button>
  </div>

  <div class="gallery">
    <img src="nek12.jpg" alt="Necklace 12">
    <p class="price">₹2550</p>
    <button onclick="addToCart('Necklace 12',2550,'nek12.jpg')">Add to Cart</button>
  </div>

</div>

<!-- CART SCRIPT -->
<script>
  let cart = JSON.parse(localStorage.getItem("cart")) || [];

  function addToCart(name, price, image) {
    cart.push({ name, price, image });
    localStorage.setItem("cart", JSON.stringify(cart));
    alert(name + " added to cart!");
  }
</script>

</body>
</html>
